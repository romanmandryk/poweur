name: External relay health
# Schedule is paused. Every 15 minutes is about 2,900 minutes/month: each run
# rounds up to 1 minute, which is more than the free private-repo quota by itself.
# Run by hand: Actions → External relay health → Run workflow.
# Restore the probe by uncommenting the schedule. Same-VM Grafana cannot see a
# total VM outage; Better Stack uptime (deploy/betterstack/uptime.json) can.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe from outside the VM
        run: |
          curl --fail --silent --show-error --max-time 15 --retry 3 --retry-delay 10 https://relay.poweur.net/health > /tmp/health.json
          jq -e '.storage.writable != false and (.version | type == "string" and length > 0)' /tmp/health.json > /dev/null
