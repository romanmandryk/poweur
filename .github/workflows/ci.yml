name: CI

# Two tiers, so a pull request never waits for the slow suites:
#
#   fast  every pull request, and Deploy when it is asked to test. About 3 to 4 minutes
#         wall clock: the jobs run side by side and each job only runs when the files it
#         covers changed. Unit and integration tests, the SDK, the web app's unit tests plus
#         a Playwright smoke set, the docs build, the deploy configuration checks.
#   full  nightly (02:17 UTC) and by hand: everything in fast plus the whole Playwright
#         suite (sharded three ways), the OAuth bridge against live oauth2-proxy, Keycloak
#         and Authentik containers, and the real ingest and dashboard smoke test, which
#         starts the monitoring stack in Docker.
#
# Run by hand: Actions → CI → Run workflow → suite: fast or full.
# The branch rule requires one status, "CI result", which is green only when every job that
# had to run passed (a job skipped because its files did not change counts as passed).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      suite:
        description: fast (pull request checks) or full (adds the whole browser suite and the Docker smoke test)
        type: choice
        options: [fast, full]
        default: fast
  workflow_call:
    inputs:
      suite:
        type: string
        default: fast
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.25"

jobs:
  # Which parts of the repository this run has to cover. Pull requests look at the diff;
  # everything else (manual, nightly, Deploy) covers everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      go: ${{ steps.plan.outputs.go }}
      ts: ${{ steps.plan.outputs.ts }}
      web: ${{ steps.plan.outputs.web }}
      docs: ${{ steps.plan.outputs.docs }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          full=false
          if [ "$EVENT" = schedule ] || [ "$SUITE" = full ]; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != pull_request ]; then
            for k in go ts web docs deploy; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          files="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$files"
          hit() { if echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          # Shared workspace files (go.work, the lockfile, this workflow) touch everything.
          shared="$(hit '^(go\.work|go\.work\.sum|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|\.github/workflows/ci\.yml)$')"
          pick() { if [ "$shared" = true ] || [ "$(hit "$1")" = true ]; then echo true; else echo false; fi; }
          echo "go=$(pick '^(apps/(api|cli|demoapps|integration|oauth)|packages/identity|conventions)/')" >> "$GITHUB_OUTPUT"
          echo "ts=$(pick '^(packages/(client-ts|identity)|apps/(api|cli))/')" >> "$GITHUB_OUTPUT"
          echo "web=$(pick '^(apps/(web|api|oauth|mobile|demoapps)|packages/(client-ts|faro|identity))/')" >> "$GITHUB_OUTPUT"
          echo "docs=$(pick '^(apps/(docs|site)|epics)/')" >> "$GITHUB_OUTPUT"
          echo "deploy=$(pick '^(deploy|docker-compose\.prod\.yml|\.github/workflows|scripts)/?')" >> "$GITHUB_OUTPUT"

  # A pull request that changes a package's shipped code has to bump its version (AGENTS.md →
  # Version bumps). Label the PR `no-version-bump` when behaviour really is unchanged.
  version-bump:
    name: Version bumps
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          SKIP_VERSION_CHECK: ${{ contains(github.event.pull_request.labels.*.name, 'no-version-bump') && '1' || '0' }}
        run: node scripts/check-version-bumps.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  go-unit:
    name: Go unit tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/demoapps/go.sum
            apps/oauth/go.sum
            packages/identity/go.sum
      # `go test` already vets the basics; these are the checks it leaves out that catch real bugs.
      - run: go vet -httpresponse -copylocks -lostcancel -loopclosure ./packages/identity/... ./apps/api/... ./apps/cli/... ./apps/demoapps/... ./apps/oauth/...
      - run: |
          go test ./packages/identity/...
          go test ./apps/api/...
          go test ./apps/cli/...
          go test ./apps/demoapps/...
          go test ./apps/oauth/...

  # Real in-process relays, the CLI and a fake DNS zone. The longest Go job (about a minute
  # on a laptop), so it runs next to the unit tests, not after them.
  go-integration:
    name: Go integration tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/demoapps/go.sum
            apps/integration/go.sum
            apps/oauth/go.sum
            packages/identity/go.sum
      - working-directory: apps/integration
        run: go test ./... -count=1

  client-ts:
    name: "@poweur/client"
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/api/go.sum
            packages/identity/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @poweur/client

      # Go stays canonical: regenerate the conformance vectors from the Go implementation
      # before the TypeScript suite consumes them. A canonical string changed in Go without
      # a matching TS change fails the next step.
      - name: Regenerate conformance vectors
        run: pnpm vectors

      # The deterministic vectors must round-trip byte-for-byte. encryption.json is
      # excluded on purpose: every seal uses a fresh ephemeral key and nonce.
      - name: Deterministic vectors are reproducible
        run: |
          git diff --exit-code -- \
            packages/identity/testdata/vectors/canonical.json \
            packages/identity/testdata/vectors/documents.json \
            packages/identity/testdata/vectors/grant-paths.json \
            packages/identity/testdata/vectors/grants.json \
            packages/identity/testdata/vectors/groups.json \
            packages/identity/testdata/vectors/names.json \
            packages/identity/testdata/vectors/id-input.json \
            packages/identity/testdata/vectors/pow.json \
            packages/identity/testdata/vectors/pow-clamp.json \
            packages/identity/testdata/vectors/contacts.json \
            packages/identity/testdata/vectors/inbox-policies.json

      - run: pnpm client:typecheck
      - run: pnpm client:build
      # The suite spawns a real Go relay (`go run`) for the integration files.
      - run: pnpm client:test

      - name: Built output imports cleanly from plain Node ESM
        run: |
          node --input-type=module -e "
            import { PoweurClient, solvePow, PROTOCOL_VERSION } from './packages/client-ts/dist/index.js';
            if (typeof PoweurClient !== 'function' || typeof solvePow !== 'function') process.exit(1);
            console.log('protocol v' + PROTOCOL_VERSION);
          "
      - name: CLI runs from the built output
        run: node packages/client-ts/dist/cli/bin.js version

  # Typecheck, unit tests and a browser smoke set: first run, messaging policy, contacts
  # journeys. The rest of the browser suite is the full tier.
  web:
    name: Web app (unit and smoke)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/demoapps/go.sum
            apps/oauth/go.sum
            packages/identity/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poweur/web exec playwright install chromium --with-deps
      - run: pnpm client:build
      - run: pnpm web:typecheck

      # The suites below `go run` the relay (and build the CLI) inside their startup
      # timeouts. Compile them first, so a cold module cache is a slow step here and not a
      # "relay not healthy" there.
      - name: Warm the Go builds the suites start
        run: |
          (cd apps/api && go build -o /dev/null .)
          (cd apps/cli && go build -o /dev/null .)

      - run: pnpm web:test
      - run: pnpm --filter @poweur/web test:e2e:smoke

  # The whole browser suite, three shards side by side. About five minutes on a laptop in
  # one piece; each shard is about a third of that.
  web-e2e:
    name: "Web app, browser suite (shard ${{ matrix.shard }}/3)"
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/demoapps/go.sum
            apps/oauth/go.sum
            packages/identity/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poweur/web exec playwright install chromium --with-deps
      - run: pnpm client:build
      - name: Warm the Go builds the suites start
        run: |
          (cd apps/api && go build -o /dev/null .)
          (cd apps/oauth && go build -o /dev/null ./cmd/poweur-oauth)
          (cd apps/cli && go build -o /dev/null .)
      # The OAuth bridge embeds its pages (apps/oauth/ui) at compile time; the
      # oauth-bridge specs `go run` it, so build the pages first.
      - run: pnpm --filter @poweur/oauth-ui build
      # Called directly: the package script's `--` would swallow the shard flag.
      - run: pnpm --filter @poweur/web exec vite build
      - run: pnpm --filter @poweur/web exec playwright test --shard=${{ matrix.shard }}/3

  # The bridge against real products, in Docker: an unmodified oauth2-proxy, Keycloak and
  # Authentik take a Poweur ID through the web signer. Each pulls a large image (Authentik is
  # a four-container stack), so they run nightly and by hand, one job each.
  oauth-live:
    name: "OAuth bridge live: ${{ matrix.product }}"
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        product: [oauth2-proxy, keycloak, authentik]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/oauth/go.sum
            packages/identity/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poweur/web exec playwright install chromium --with-deps
      - run: pnpm client:build
      - name: Warm the Go builds the specs start
        run: |
          (cd apps/api && go build -o /dev/null .)
          (cd apps/oauth && go build -o /dev/null ./cmd/poweur-oauth)
          (cd apps/cli && go build -o /dev/null .)
      - run: pnpm --filter @poweur/oauth-ui build
      # The specs sign in through the built web app the relay serves at /app/.
      - run: pnpm --filter @poweur/web exec vite build
      - name: Pull the product image
        run: |
          case "${{ matrix.product }}" in
            oauth2-proxy) docker pull quay.io/oauth2-proxy/oauth2-proxy:v7.12.0 ;;
            keycloak)     docker pull quay.io/keycloak/keycloak:26.3 ;;
            authentik)    docker pull ghcr.io/goauthentik/server:2026.8.2 && docker pull postgres:16-alpine && docker pull redis:alpine ;;
          esac
      - name: Run the live spec
        env:
          POWEUR_LIVE_DOCKER: "1"
        run: pnpm --filter @poweur/web exec playwright test test/e2e/oauth-live-${{ matrix.product }}.spec.js

  docs:
    name: Docs and website build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @poweur/docs
      - run: pnpm --filter @poweur/docs build

  deploy-config:
    name: Deployment configuration
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test deploy/tests/*.test.mjs
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - name: Validate Caddy
        run: docker run --rm -v "$PWD/deploy/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile

  # Starts the Alloy, Loki, Prometheus and Grafana stack in Docker and sends real
  # telemetry through it: about a minute and a half, so nightly and by hand only.
  stack-smoke:
    name: Real ingest and dashboard smoke test
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node deploy/tests/stack-smoke.mjs

  # The one check the branch rule asks for. A job skipped because its files did not change
  # counts as fine; a failed or cancelled one does not.
  result:
    name: CI result
    if: always()
    needs: [changes, version-bump, go-unit, go-integration, client-ts, web, web-e2e, oauth-live, docs, deploy-config, stack-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Every job that had to run passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "A job failed or was cancelled" >&2; exit 1 ;;
          esac
