name: CI

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    name: Go (relay, CLI, identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/integration/go.sum
            packages/identity/go.sum

      - name: Unit tests
        run: |
          go test ./packages/identity/...
          go test ./apps/api/...
          go test ./apps/cli/...

      - name: Integration tests (real in-process relays)
        working-directory: apps/integration
        run: go test ./... -count=1

  client-ts:
    name: "@poweur/client"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/api/go.sum
            packages/identity/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @poweur/client

      # Go stays canonical: regenerate the conformance vectors from the Go
      # implementation before the TypeScript suite consumes them. A canonical
      # string changed in Go without a matching TS change fails the next step.
      - name: Regenerate conformance vectors
        run: pnpm vectors

      # The deterministic vectors must round-trip byte-for-byte. encryption.json
      # is excluded on purpose: every seal uses a fresh ephemeral key and nonce,
      # so its bytes change on every run by design.
      - name: Deterministic vectors are reproducible
        run: |
          git diff --exit-code -- \
            packages/identity/testdata/vectors/canonical.json \
            packages/identity/testdata/vectors/documents.json \
            packages/identity/testdata/vectors/grant-paths.json \
            packages/identity/testdata/vectors/grants.json \
            packages/identity/testdata/vectors/groups.json \
            packages/identity/testdata/vectors/names.json \
            packages/identity/testdata/vectors/pow.json \
            packages/identity/testdata/vectors/pow-clamp.json \
            packages/identity/testdata/vectors/contacts.json \
            packages/identity/testdata/vectors/inbox-policies.json

      - run: pnpm client:typecheck
      - run: pnpm client:build

      # The suite spawns a real Go relay (`go run`) for the integration files.
      - run: pnpm client:test

      - name: Built output imports cleanly from plain Node ESM
        run: |
          node --input-type=module -e "
            import { PoweurClient, solvePow, PROTOCOL_VERSION } from './packages/client-ts/dist/index.js';
            if (typeof PoweurClient !== 'function' || typeof solvePow !== 'function') process.exit(1);
            console.log('protocol v' + PROTOCOL_VERSION);
          "

      - name: CLI runs from the built output
        run: node packages/client-ts/dist/cli/bin.js version

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/api/go.sum
            packages/identity/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The SPA loads @poweur/client from a committed copy of the package's ESM
      # (no bundler). A change to the package that skipped the vendor step ships
      # a stale protocol to browsers, so rebuild and diff rather than trust it.
      - run: pnpm client:build
      - run: pnpm web:vendor:check

      # Both suites spawn a real Go relay (`go run`).
      - run: pnpm web:test
      - run: pnpm web:test:e2e

  web-next:
    name: Web app (EPIC-021 React rewrite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/api/go.sum
            packages/identity/go.sum

      # The full workspace: the e2e suite lives in apps/web and drives both apps.
      - run: pnpm install --frozen-lockfile
      - run: pnpm client:build
      - run: pnpm web-next:typecheck
      - run: pnpm web-next:test
      - run: pnpm web-next:build

      # EPIC-021 T12: the legacy Playwright suite, pointed at /newapp/. Both apps
      # must stay green until the cutover (E21-T14).
      - name: E2E against /newapp/
        run: pnpm --filter @poweur/web exec env POWEUR_APP_PATH=/newapp/ playwright test

  observability:
    name: Observability and deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deploy/tests/*.test.mjs
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - name: Validate Caddy
        run: docker run --rm -v "$PWD/deploy/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Real ingest and dashboard smoke test
        run: node deploy/tests/stack-smoke.mjs
