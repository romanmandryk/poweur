name: CI

# Off the automatic path while Actions minutes are tight. A master push used to
# run this suite twice (this file, then Deploy calling it again).
#
# Run by hand: Actions → CI → Run workflow.
# Gate deploys on it again: repository variable RUN_CI=true
#   (Settings → Secrets and variables → Actions → Variables).
# Pull-request checks: uncomment `pull_request` below. Leave `push` commented —
# Deploy is what runs on master, and uncommenting `push` bills this suite twice.
on:
  workflow_dispatch:
  workflow_call:
  # pull_request:
  # push:
  #   branches: [master]

jobs:
  go:
    name: Go (relay, CLI, identity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/demoapps/go.sum
            apps/integration/go.sum
            apps/oauth/go.sum
            packages/identity/go.sum

      - name: Unit tests
        run: |
          go test ./packages/identity/...
          go test ./apps/api/...
          go test ./apps/cli/...
          go test ./apps/demoapps/...
          go test ./apps/oauth/...

      - name: Integration tests (real in-process relays)
        working-directory: apps/integration
        run: go test ./... -count=1

  client-ts:
    name: "@poweur/client"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/api/go.sum
            packages/identity/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @poweur/client

      # Go stays canonical: regenerate the conformance vectors from the Go
      # implementation before the TypeScript suite consumes them. A canonical
      # string changed in Go without a matching TS change fails the next step.
      - name: Regenerate conformance vectors
        run: pnpm vectors

      # The deterministic vectors must round-trip byte-for-byte. encryption.json
      # is excluded on purpose: every seal uses a fresh ephemeral key and nonce,
      # so its bytes change on every run by design.
      - name: Deterministic vectors are reproducible
        run: |
          git diff --exit-code -- \
            packages/identity/testdata/vectors/canonical.json \
            packages/identity/testdata/vectors/documents.json \
            packages/identity/testdata/vectors/grant-paths.json \
            packages/identity/testdata/vectors/grants.json \
            packages/identity/testdata/vectors/groups.json \
            packages/identity/testdata/vectors/names.json \
            packages/identity/testdata/vectors/id-input.json \
            packages/identity/testdata/vectors/pow.json \
            packages/identity/testdata/vectors/pow-clamp.json \
            packages/identity/testdata/vectors/contacts.json \
            packages/identity/testdata/vectors/inbox-policies.json

      - run: pnpm client:typecheck
      - run: pnpm client:build

      # The suite spawns a real Go relay (`go run`) for the integration files.
      - run: pnpm client:test

      - name: Built output imports cleanly from plain Node ESM
        run: |
          node --input-type=module -e "
            import { PoweurClient, solvePow, PROTOCOL_VERSION } from './packages/client-ts/dist/index.js';
            if (typeof PoweurClient !== 'function' || typeof solvePow !== 'function') process.exit(1);
            console.log('protocol v' + PROTOCOL_VERSION);
          "

      - name: CLI runs from the built output
        run: node packages/client-ts/dist/cli/bin.js version

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/demoapps/go.sum
            apps/oauth/go.sum
            packages/identity/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poweur/web exec playwright install chromium
      - run: pnpm client:build
      - run: pnpm web:typecheck

      # The suites below `go run` the relay and the bridge (and build the CLI)
      # inside their startup timeouts. Compile them first, so a cold module
      # cache is a slow step here and not a "relay not healthy" there.
      - name: Warm the Go builds the suites start
        run: |
          (cd apps/api && go build -o /dev/null .)
          (cd apps/oauth && go build -o /dev/null ./cmd/poweur-oauth)
          (cd apps/cli && go build -o /dev/null .)

      # The live-relay suites spawn a real Go relay (`go run`).
      - run: pnpm web:test
      - run: pnpm web

      # The OAuth bridge embeds its pages (apps/oauth/ui) at compile time; the
      # oauth-bridge specs `go run` it, so build the pages first.
      - run: pnpm --filter @poweur/oauth-ui build

      # Playwright drives the built app at /app/ on a real Go relay — the same
      # tree the image serves and the Capacitor shell stages. oauth-bridge.spec
      # also starts the OAuth bridge (`go run ./apps/oauth/cmd/poweur-oauth`).
      - run: pnpm web:test:e2e

  observability:
    name: Observability and deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deploy/tests/*.test.mjs
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - name: Validate Caddy
        run: docker run --rm -v "$PWD/deploy/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Real ingest and dashboard smoke test
        run: node deploy/tests/stack-smoke.mjs
