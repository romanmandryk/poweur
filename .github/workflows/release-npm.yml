name: Release npm packages

# Publishes @poweur/client (the TypeScript SDK and its CLI) and the `poweur` alias
# package, which carry the same version. Push a tag `sdk-v<version>` that matches
# packages/client-ts/package.json, or run it by hand with "Dry run" ticked to build
# and pack without publishing. Needs the NPM_TOKEN repository secret (an npm
# automation token for the @poweur org). Provenance needs a public repository.
on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack, but do not publish
        type: boolean
        default: true

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @poweur/client... --filter poweur...

      - name: The tag, the SDK and the alias agree on one version
        id: version
        run: |
          v="$(node -p "require('./packages/client-ts/package.json').version")"
          alias="$(node -p "require('./packages/poweur/package.json').version")"
          if [ "$alias" != "$v" ]; then echo "packages/poweur is $alias but @poweur/client is $v" >&2; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "sdk-v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $v" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: pnpm --filter @poweur/client build
      - run: pnpm --filter @poweur/client typecheck
      - run: pnpm --filter @poweur/client test

      - name: Pack (shows exactly what would be published)
        run: |
          pnpm --filter @poweur/client pack --pack-destination "$RUNNER_TEMP"
          pnpm --filter poweur pack --pack-destination "$RUNNER_TEMP"
          ls -l "$RUNNER_TEMP"/*.tgz

      # Each package is published only if that version is not on npm yet, so a rerun after a
      # partial failure carries on where it stopped. The `poweur` alias needs npm to have
      # approved the name (its typosquatting check flags it as close to "bower"); until then
      # leave the repository variable PUBLISH_POWEUR_ALIAS unset. Set it to "true" afterwards.
      - name: Publish
        if: ${{ github.ref_type == 'tag' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_ALIAS: ${{ vars.PUBLISH_POWEUR_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is not set" >&2; exit 1; }
          publish() {
            if npm view "$1@$VERSION" version >/dev/null 2>&1; then
              echo "$1@$VERSION is already on npm, skipping"
            else
              pnpm --filter "$1" publish --access public --provenance --no-git-checks
            fi
          }
          publish @poweur/client
          if [ "$PUBLISH_ALIAS" = true ]; then publish poweur; else echo "alias poweur not published (PUBLISH_POWEUR_ALIAS is not true)"; fi

      - name: GitHub release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "SDK ${{ steps.version.outputs.version }}" --generate-notes
