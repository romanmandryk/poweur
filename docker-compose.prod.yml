services:
  relay:
    image: ghcr.io/romanmandryk/poweur-relay:latest
    container_name: poweur-relay
    restart: unless-stopped
    env_file:
      - apps/api/.env.prod
    environment:
      WEB_STATIC_DIR: /web
      POWEUR_DATA: /data
      # Hosted registration (set HOSTED_DOMAINS / REGISTRATION_GATE in .env.prod)
      # Handle policy (EPIC-018). The package default is 3 so the test
      # fixtures ("bob") keep working; production holds short handles back.
      NAME_MIN_LEN: "6"
      NAME_MAX_LEN: "24"
      # NAME_RESERVED: extra names, CSV — adds to the built-in list
      # NAME_BLOCKED_FILE: /data/blocked-terms.txt (one term per line)
      # NAME_BLOCK_MODE: substring | exact
    volumes:
      - ./apps/web:/web:ro
      - poweur_data:/data
    networks:
      - poweur_net
      - infra_net

volumes:
  poweur_data:

networks:
  poweur_net:
    name: poweur_net
    driver: bridge
  infra_net:
    name: infra_net
    external: true
