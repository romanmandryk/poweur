services:
  relay:
    image: ghcr.io/romanmandryk/poweur-relay:latest
    container_name: poweur-relay
    restart: unless-stopped
    env_file:
      - apps/api/.env.prod
    environment:
      WEB_STATIC_DIR: /web
      POWEUR_DATA: /data
      # Hosted registration (set HOSTED_DOMAINS / REGISTRATION_GATE in .env.prod)
    volumes:
      - ./apps/web:/web:ro
      - poweur_data:/data
    networks:
      - poweur_net
      - infra_net

volumes:
  poweur_data:

networks:
  poweur_net:
    name: poweur_net
    driver: bridge
  infra_net:
    name: infra_net
    external: true
