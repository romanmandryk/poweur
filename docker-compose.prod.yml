services:
  relay:
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to a GHCR digest}
    container_name: poweur-relay
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    env_file:
      - ${RELAY_ENV_FILE:-apps/api/.env.prod}
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      TELEMETRY_ENVIRONMENT: ${TELEMETRY_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      TELEMETRY_HASH_KEY: ${TELEMETRY_HASH_KEY:-}
      TELEMETRY_ALLOW_HTTP: ${TELEMETRY_ALLOW_HTTP:-0}
      TELEMETRY_TRUSTED_PROXIES: ${TELEMETRY_TRUSTED_PROXIES:-}
      TELEMETRY_OTLP_SECONDARY_ENDPOINT: ${TELEMETRY_OTLP_SECONDARY_ENDPOINT:-}
      TELEMETRY_OTLP_SECONDARY_HEADERS: ${TELEMETRY_OTLP_SECONDARY_HEADERS:-}
      TELEMETRY_UPTIME_URL: ${TELEMETRY_UPTIME_URL:-}
      # Browser telemetry (Grafana Faro): the web app sends to this same-origin
      # path, which Caddy routes to Alloy (deploy/infra). Empty turns it off.
      FARO_COLLECT_URL: ${FARO_COLLECT_URL:-/faro/collect}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Whole handles nobody can claim, on top of the built-in list in
      # packages/identity/names.go: our own hosts, roles, and big brands
      # (substring terms live in deploy/relay/blocked-terms.txt). Anything in
      # NAME_RESERVED on the host is appended.
      NAME_RESERVED: >-
        ingest,metrics,grafana,stats,
        hello,guestbook,feedback,info,sales,press,jobs,careers,hr,ceo,founder,owner,operator,
        administrator,sysadmin,moderator,mod,trust,safety,ops,devops,webmaster,
        google,apple,microsoft,amazon,meta,facebook,instagram,whatsapp,twitter,
        github,gitlab,paypal,stripe,anthropic,openai,claude,chatgpt,
        ${NAME_RESERVED:-}
      # The web client is built into the image at /web and served at /app/.
      WEB_STATIC_DIR: /web
      POWEUR_DATA: /data
      # Which domains this relay hosts names under. Without it `GET /` answers
      # `hosted_domains: null` and every host classifies as `unknown` (E15-T7):
      # the apex is not a launcher, `bob.poweur.net` is not an identity host,
      # and all three front doors collapse to the generic welcome. Set here
      # rather than left to `apps/api/.env.prod`, because that file is written
      # by Ansible and this compose file is what the GitHub deploy re-runs.
      HOSTED_DOMAINS: poweur.net
      # The OAuth/OIDC bridge (apps/oauth/deploy): hosted identities advertise
      # it in capabilities.json and as their IndieAuth metadata. The relay
      # never talks to it.
      OAUTH_BRIDGE_URL: https://oauth.poweur.org
      # Handle policy (EPIC-018). The package default is 3 so the test
      # fixtures ("bob") keep working; production holds short handles back.
      NAME_MIN_LEN: "6"
      NAME_MAX_LEN: "24"
      # Free storage on poweur.net is deliberately small and unadvertised
      # (200 MiB). Support raises one identity's limit with
      # `docker exec poweur-relay /relay quotas set <id> 2GiB` (stored in the
      # bucket, picked up within a minute), and QUOTA_CONTACT is the ID an
      # over-quota upload is told to message.
      MAX_IDENTITY_BYTES: "209715200"
      QUOTA_CONTACT: ${QUOTA_CONTACT:-support.poweur.net}
      # Terms that can't appear anywhere in a handle (deploy/relay/blocked-terms.txt).
      NAME_BLOCKED_FILE: /etc/poweur/blocked-terms.txt
      NAME_BLOCK_MODE: substring
    volumes:
      - poweur_data:/data
      - ./deploy/relay/blocked-terms.txt:/etc/poweur/blocked-terms.txt:ro
    networks:
      - poweur_net
      - infra_net

  # hello.poweur.net, the demo bot (apps/demoapps/hello): answers any message with a
  # fixed reply. The same image as the relay, a different binary. Its ID's key
  # files live on the host in /opt/apps/poweur-hello/keys (hello.poweur.net.key
  # and .enc, mode 600, never in git); nothing else about it is persistent.
  hello:
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to a GHCR digest}
    container_name: poweur-hello
    restart: unless-stopped
    entrypoint: ["/hello-bot"]
    environment:
      IDENTITY: hello.poweur.net
      RELAY_URL: https://relay.poweur.net
      KEYS_DIR: /keys
      HOME: /home/bot
      HELLO_DEMO_URL: ${HELLO_DEMO_URL:-}
    volumes:
      - /opt/apps/poweur-hello/keys:/keys:ro
    # Sessions and the CLI's bookkeeping are throwaway: memory only, bounded.
    tmpfs:
      - /home/bot:size=64m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - poweur_net

  # guestbook.poweur.net (apps/demoapps/guestbook): the "Sign in with Poweur ID" demo and a
  # public guestbook. The same image as the relay, a different binary. The guestbook is itself
  # a Poweur ID: its entries are Markdown files in the public folder `guestbook` of that
  # ID's own drive (https://guestbook.poweur.net/pub/guestbook/), so nothing here is
  # persistent except the ID's key files in /opt/apps/poweur-guestbook/keys
  # (guestbook.poweur.net.key and .enc, mode 600, never in git). Caddy sends the site's
  # pages here and /pub and /.well-known/poweur to the relay. Run ONE instance: it is the
  # only writer of the log.
  guestbook:
    image: ${RELAY_IMAGE:?Set RELAY_IMAGE to a GHCR digest}
    container_name: poweur-guestbook
    restart: unless-stopped
    entrypoint: ["/guestbook"]
    environment:
      ORIGIN: https://guestbook.poweur.net
      IDENTITY: guestbook.poweur.net
      RELAY_URL: https://relay.poweur.net
      KEYS_DIR: /keys
      HOME: /home/bot
      LISTEN: ":8080"
    volumes:
      - /opt/apps/poweur-guestbook/keys:/keys:ro
    # The CLI's sessions and chunk cache, and the files it reads and writes the log
    # through: throwaway, memory only, bounded.
    tmpfs:
      - /home/bot:size=64m
      - /tmp:size=16m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - poweur_net
      - infra_net

volumes:
  poweur_data:

networks:
  poweur_net:
    name: poweur_net
    driver: bridge
  infra_net:
    name: infra_net
    external: true
