# Usage:
#   ansible-galaxy collection install -r requirements.yml
#   cp secrets.example.yml secrets.yml && $EDITOR secrets.yml
#   cp inventory.example.yml inventory.yml && $EDITOR inventory.yml   # your server IP
#   ansible-playbook -i inventory.yml playbook.yml
#
# Re-run at any time — skips completed steps, applies only diffs.
# SSH keys and the git clone are generated/attempted once; subsequent runs
# update config files and env vars but leave keys and the repo untouched.

---
- name: Bootstrap poweur production server
  hosts: poweur
  become: true
  vars_files:
    - secrets.yml

  vars:
    infra_dir: /opt/infra
    app_dir: /opt/apps/poweur

  tasks:

    # ── 1. System packages ─────────────────────────────────────────────────────

    - name: Install base packages
      ansible.builtin.apt:
        name: [git, curl, ca-certificates, gnupg, lsb-release, rsync, ufw, jq, openssl]
        state: present
        update_cache: true

    # ── 2. Docker CE ───────────────────────────────────────────────────────────

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Install Docker CE
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    # ── 3. Linux users ─────────────────────────────────────────────────────────

    - name: Create system users with docker access
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true
      loop:
        - infra
        - poweur

    # ── 4. Directories ─────────────────────────────────────────────────────────

    - name: Create infra directory
      ansible.builtin.file:
        path: "{{ infra_dir }}"
        state: directory
        owner: infra
        group: infra
        mode: '0750'

    - name: Create app directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: poweur
        group: poweur
        mode: '0750'
      loop:
        - /opt/apps
        - "{{ app_dir }}"
        - /opt/apps/poweur-web

    # ── 5. Infra config ────────────────────────────────────────────────────────

    - name: Sync infra config files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../infra/"
        dest: "{{ infra_dir }}/"
        owner: infra
        group: infra
        mode: preserve

    - name: Ensure postgres init SQL is readable
      ansible.builtin.file:
        path: "{{ infra_dir }}/postgres/init.sql"
        mode: '0644'

    - name: Write infra .env from template
      ansible.builtin.template:
        src: templates/infra.env.j2
        dest: "{{ infra_dir }}/.env"
        owner: infra
        group: infra
        mode: '0600'

    # ── 6. SSH keys ────────────────────────────────────────────────────────────

    - name: Create poweur .ssh directory
      ansible.builtin.file:
        path: /home/poweur/.ssh
        state: directory
        owner: poweur
        group: poweur
        mode: '0700'

    - name: Generate git deploy key (server → GitHub read-only)
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /home/poweur/.ssh/github_deploy -N "" -C "poweur-server"
        creates: /home/poweur/.ssh/github_deploy
      become_user: poweur
      register: git_key

    - name: Write SSH client config
      ansible.builtin.copy:
        dest: /home/poweur/.ssh/config
        owner: poweur
        group: poweur
        mode: '0600'
        content: |
          Host github.com
            IdentityFile ~/.ssh/github_deploy
            StrictHostKeyChecking accept-new

    - name: Generate GitHub Actions deploy key (CI → server)
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /home/poweur/.ssh/github_actions -N "" -C "github-actions"
        creates: /home/poweur/.ssh/github_actions
      register: actions_key

    - name: Fix ownership on GitHub Actions key files
      ansible.builtin.file:
        path: "{{ item }}"
        owner: poweur
        group: poweur
        mode: '0600'
      loop:
        - /home/poweur/.ssh/github_actions
        - /home/poweur/.ssh/github_actions.pub

    - name: Read GitHub Actions public key
      ansible.builtin.slurp:
        src: /home/poweur/.ssh/github_actions.pub
      register: actions_pubkey

    - name: Authorize GitHub Actions key for SSH login
      ansible.posix.authorized_key:
        user: poweur
        state: present
        key: "{{ actions_pubkey.content | b64decode | trim }}"

    # ── 7. App repo ────────────────────────────────────────────────────────────

    - name: Clone / update app repo
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: master
        update: true
        force: true
      become_user: poweur
      ignore_errors: true
      register: repo_clone
      # First run fails until the git deploy key is added to GitHub.
      # Re-run the playbook after adding it.

    - name: Check if app directory was cloned
      ansible.builtin.stat:
        path: "{{ app_dir }}/apps/api"
      register: api_dir

    - name: Write app .env.prod from template
      ansible.builtin.template:
        src: templates/api.env.prod.j2
        dest: "{{ app_dir }}/apps/api/.env.prod"
        owner: poweur
        group: poweur
        mode: '0600'
      when: api_dir.stat.exists

    # Releases are now owned by the tested GitHub deployment, with Docker's
    # restart policies handling reboot. Do not install competing compose units.
    - name: Initialize observability secrets preserving existing database passwords
      ansible.builtin.command:
        argv:
          - bash
          - "{{ app_dir }}/deploy/setup-observability.sh"
          - --file
          - "{{ app_dir }}/.observability.env"
          - --import-env
          - "{{ infra_dir }}/.env"
        creates: "{{ app_dir }}/.observability.env"
      when: api_dir.stat.exists
      no_log: true

    - name: Restrict observability secrets to deploy user
      ansible.builtin.file:
        path: "{{ app_dir }}/.observability.env"
        owner: poweur
        group: poweur
        mode: '0600'
      when: api_dir.stat.exists

    # ── 10. Firewall ──────────────────────────────────────────────────────────

    - name: Configure UFW rules
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop:
        - { port: '22',  proto: tcp, comment: SSH }
        - { port: '80',  proto: tcp, comment: HTTP }
        - { port: '443', proto: tcp, comment: HTTPS }
        - { port: '443', proto: udp, comment: "HTTP/3" }

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # ── 10-ssh. SSH: keys only ──────────────────────────────────────────────────
    # The server address is public, and the log shows thousands of password guesses a day. No
    # account here has a password, so this changes nothing for people who can log in today; it
    # closes the door on guessing. Run it with a second SSH session open, as for any sshd change.

    - name: SSH accepts keys only (no passwords, no X11, few tries)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-poweur-hardening.conf
        mode: "0644"
        content: |
          # Managed by deploy/ansible/playbook.yml
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
          PermitEmptyPasswords no
          X11Forwarding no
          MaxAuthTries 3
        validate: /usr/sbin/sshd -t -f %s
      register: sshd_hardening

    - name: Reload sshd when its hardening changed
      ansible.builtin.service:
        name: ssh
        state: reloaded
      when: sshd_hardening.changed

    # ── 10a. Daily growth digest (ntfy push, 08:00 Lisbon) ──────────────────────
    # Needs ntfy_topic in secrets.yml; skipped until it is set. deploy/digest/.

    - name: Digest config directory
      ansible.builtin.file:
        path: /etc/poweur-digest
        state: directory
        mode: '0700'
      when: ntfy_topic is defined

    - name: Digest settings (the ntfy topic is the only secret)
      ansible.builtin.template:
        src: templates/digest.env.j2
        dest: /etc/poweur-digest/digest.env
        mode: '0600'
      no_log: true
      when: ntfy_topic is defined

    - name: Install the digest script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../digest/poweur-digest.sh"
        dest: /usr/local/sbin/poweur-digest
        mode: '0750'
      when: ntfy_topic is defined

    - name: Install the digest service and timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../digest/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop: [poweur-digest.service, poweur-digest.timer]
      when: ntfy_topic is defined

    - name: Enable the daily digest timer
      ansible.builtin.systemd_service:
        name: poweur-digest.timer
        enabled: true
        state: started
        daemon_reload: true
      when: ntfy_topic is defined

    # ── 10b. Backups (restic → Hetzner Storage Box) ─────────────────────────────
    # Needs storage_box_user, storage_box_host and restic_password in secrets.yml;
    # skipped until they are set. Runbook: deploy/backup/README.md.

    - name: Backup config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop: [/etc/poweur-backup, /etc/poweur-backup/ssh]
      when: storage_box_user is defined

    - name: Generate the Storage Box SSH key
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N "" -C "poweur-backup@{{ inventory_hostname }}" -f /etc/poweur-backup/ssh/id_ed25519
        creates: /etc/poweur-backup/ssh/id_ed25519
      register: storagebox_key
      when: storage_box_user is defined

    - name: Storage Box ssh config
      ansible.builtin.template:
        src: templates/storagebox-ssh-config.j2
        dest: /etc/poweur-backup/ssh/config
        mode: '0600'
      when: storage_box_user is defined

    # known_hosts is matched by the real host name ([host]:23), not the alias.
    - name: Record the Storage Box host key (port 23)
      ansible.builtin.shell:
        cmd: ssh-keyscan -p 23 -t ed25519 {{ storage_box_host }} > /etc/poweur-backup/ssh/known_hosts && test -s /etc/poweur-backup/ssh/known_hosts
        creates: /etc/poweur-backup/ssh/known_hosts
      when: storage_box_user is defined

    - name: Restic repository password (keep a copy outside the server)
      ansible.builtin.copy:
        content: "{{ restic_password }}\n"
        dest: /etc/poweur-backup/restic-password
        mode: '0600'
      no_log: true
      when: storage_box_user is defined

    - name: Backup settings
      ansible.builtin.template:
        src: templates/backup.env.j2
        dest: /etc/poweur-backup/backup.env
        mode: '0600'
      when: storage_box_user is defined

    - name: Install the backup script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../backup/poweur-backup.sh"
        dest: /usr/local/sbin/poweur-backup
        mode: '0750'
      when: storage_box_user is defined

    - name: Install the backup service and timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../backup/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: '0644'
      loop: [poweur-backup.service, poweur-backup.timer]
      when: storage_box_user is defined

    - name: Enable the nightly backup timer
      ansible.builtin.systemd_service:
        name: poweur-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      when: storage_box_user is defined

    - name: Initialise the restic repository (needs the key installed on the Storage Box)
      ansible.builtin.command: /usr/local/sbin/poweur-backup init
      register: restic_init
      changed_when: "'created restic repository' in restic_init.stdout + restic_init.stderr"
      failed_when: false
      when: storage_box_user is defined

    - name: Read the Storage Box public key
      ansible.builtin.slurp:
        src: /etc/poweur-backup/ssh/id_ed25519.pub
      register: storagebox_pubkey
      when: storage_box_user is defined

    - name: "ACTION — install the backup key on the Storage Box, then re-run"
      ansible.builtin.debug:
        msg:
          - "Run on your laptop (asks for the Storage Box password once):"
          - "echo '{{ storagebox_pubkey.content | b64decode | trim }}' | ssh -p 23 {{ storage_box_user }}@{{ storage_box_host }} install-ssh-key"
          - "Then re-run the playbook to initialise the repository, and test with: sudo poweur-backup run"
      when: storage_box_user is defined and (restic_init.rc | default(0)) != 0

    # ── 11. Post-run instructions ──────────────────────────────────────────────

    - name: Read git deploy public key
      ansible.builtin.slurp:
        src: /home/poweur/.ssh/github_deploy.pub
      register: git_pubkey

    - name: Read GitHub Actions private key
      ansible.builtin.slurp:
        src: /home/poweur/.ssh/github_actions
      register: actions_privkey

    - name: "ACTION 1/3 — Add git deploy key to GitHub (Settings → Deploy keys)"
      ansible.builtin.debug:
        msg: "{{ git_pubkey.content | b64decode | trim }}"
      when: git_key.changed

    - name: "ACTION 2/3 — Add DEPLOY_SSH_KEY Actions secret (Settings → Secrets → Actions)"
      ansible.builtin.debug:
        msg: "{{ actions_privkey.content | b64decode }}"
      when: actions_key.changed

    - name: "ACTION 3/3 — Add DEPLOY_HOST Actions secret"
      ansible.builtin.debug:
        msg: "Name: DEPLOY_HOST   Value: {{ ansible_host }}"
      when: actions_key.changed

    - name: Bootstrap summary
      ansible.builtin.debug:
        msg: >-
          {{
            'Repo clone failed — add the deploy key to GitHub, then re-run.'
            if repo_clone.failed | default(false) else
            'Done. Follow deploy/README.md for the first release and legacy systemd migration'
          }}
