# Copy to secrets.yml and fill in real values. secrets.yml is gitignored.

# Postgres
postgres_password: "CHANGE_ME"
grafana_password: "CHANGE_ME"
grafana_db_password: "CHANGE_ME"

# Relay app config
relay_address: "relay.poweur.net"
relay_scheme: "https"
dns_proxy_mode: "always"
listen_addr: ":8080"
hosted_domains: "poweur.net"

# Relay storage in an S3 bucket (optional; POWEUR_DATA disk when unset). Hetzner does
# not enforce presigned checksums, so keep relay_s3_presign "0" there.
# relay_s3_endpoint: "hel1.your-objectstorage.com"
# relay_s3_bucket: "poweur"
# relay_s3_region: "hel1"
# relay_s3_prefix: ""
# relay_s3_access_key: "CHANGE_ME"
# relay_s3_secret_key: "CHANGE_ME"
# relay_s3_presign: "0"

# Git
repo_url: "git@github.com:romanmandryk/poweur.git"

# Backups (restic → Hetzner Storage Box). Off while these stay commented out;
# uncomment and fill in all of them to turn the backup on (deploy/BACKUP.md).
# Storage Box: Hetzner console → Storage Boxes → your box → enable "SSH support".
# storage_box_user: "u123456"
# storage_box_host: "u123456.your-storagebox.de"
# Directory for this repository, relative to the Storage Box home directory.
# storage_box_path: "poweur-restic"
# Encrypts the backups. Generate with `openssl rand -base64 32` and store a copy in
# your password manager: without it no backup can ever be read.
# restic_password: "CHANGE_ME"
# Deleted data leaves these backups after this long; the privacy policy must match.
# backup_keep_within: "30d"
# Optional heartbeat that alerts when a night is missed ("/fail" appended on failure).
# backup_heartbeat_url: ""

