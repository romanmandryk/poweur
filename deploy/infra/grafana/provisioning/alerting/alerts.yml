  "contactPoints": [
    {
      "orgId": 1,
      "name": "Operator email",
      "receivers": [
        {
          "uid": "operator-email",
          "type": "email",
          "settings": {
            "addresses": "$ALERT_EMAIL",
            "singleEmail": true
          },
          "disableResolveMessage": false
        }
      ]
    }
  ],
  "policies": [
    {
      "orgId": 1,
      "receiver": "Operator email",
      "group_by": [
        "alertname"
      ],
      "group_wait": "30s",
      "group_interval": "5m",
      "repeat_interval": "4h"
    }
  ]
}
