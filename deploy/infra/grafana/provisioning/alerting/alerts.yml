              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "min(node_filesystem_avail_bytes{mountpoint=\"/\"}/node_filesystem_size_bytes{mountpoint=\"/\"}) < bool 0.2",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
