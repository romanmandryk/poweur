          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0s",
          "annotations": {
            "summary": "An authorization code was presented twice; the bridge revoked its tokens. A code leaked somewhere; check the bridge audit log."
          },
          "labels": {
            "service": "poweur"
          },
          "isPaused": false
