{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "Poweur",
      "folder": "Poweur",
      "interval": "1m",
      "rules": [
        {
          "uid": "relay-down",
          "title": "Relay health probe failed",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "(min(probe_success{job=\"blackbox\"}) < bool 1) or absent(probe_success{job=\"blackbox\"})",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "type": "query",
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "A"
                      ]
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "2m",
          "annotations": {
            "summary": "Relay health probe failed"
          },
          "labels": {
            "service": "poweur"
          },
          "isPaused": false
        },
