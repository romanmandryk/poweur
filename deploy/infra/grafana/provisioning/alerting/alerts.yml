          "title": "OAuth authorization code reused",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 300,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum(increase(poweur_oauth_events_total{event=\"token.code_reused\"}[15m])) or vector(0)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
