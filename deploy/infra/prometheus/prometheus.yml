global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [rules.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alloy
    static_configs:
      - targets: [infra-alloy:12345]
  - job_name: node
    static_configs:
      - targets: [infra-node-exporter:9100]
  # The OAuth bridge (apps/oauth): request/latency/rate-limit/audit-event
  # counters. Its own job, and its own probe below, so relay alerts stay
  # about the relay.
  - job_name: poweur-oauth
    static_configs:
      - targets: [poweur-oauth:9464]
  # The demo apps (apps/demoapps), each on a private :9464 listener. Labelled
  # like the relay's OTLP series so the Growth recording rules select them
  # with the same deployment_environment_name="production".
  - job_name: poweur-hello
    static_configs:
      - targets: [poweur-hello:9464]
        labels: {deployment_environment_name: production}
  - job_name: poweur-guestbook
    static_configs:
      - targets: [poweur-guestbook:9464]
        labels: {deployment_environment_name: production}
  - job_name: blackbox-oauth
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [https://oauth.poweur.org/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: infra-blackbox:9115
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [https://relay.poweur.net/health]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: infra-blackbox:9115
