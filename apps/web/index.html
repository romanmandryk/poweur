<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Eurything</title>
  <link rel="preconnect" href="https://esm.sh" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Main app mount point — all HTML is generated by app.js -->
  <div id="app"></div>

  <!-- Toast container (outside app so it's always on top) -->
  <div id="toast-root" aria-live="polite"></div>

  <!-- Full-screen loading overlay -->
  <div id="loading-root" class="loading-root hidden" role="status">
    <div class="loading-inner">
      <div class="spinner"></div>
      <p id="loading-text">Working…</p>
    </div>
  </div>

  <!-- Bottom-sheet panel overlay -->
  <div id="panel-backdrop" class="panel-backdrop hidden"></div>
  <div id="panel-root" class="panel-root hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
