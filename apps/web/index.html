<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Poweur ID</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- The protocol lives in @poweur/client, vendored into ./vendor by
       `pnpm vendor`. No bundler and no CDN: the app is self-contained, which is
       what offline and self-hosted installs need (EPIC-015 E15-T6).

       Paths are relative to the document base, not absolute. The relay serves
       this page at /app/ (and redirects /app to /app/), a plain static server
       serves it at /, and EPIC-019's Capacitor shell serves it from
       capacitor://localhost/ — an absolute "/app/…" would only work in the
       first of those, which is the same coupling E15-T1 removes from relay
       URLs. -->
  <script type="importmap">
  {
    "imports": {
      "@poweur/client": "./vendor/poweur-client/index.js",
      "@poweur/client/browser": "./vendor/poweur-client/browser/index.js"
    }
  }
  </script>
</head>
<body>
  <!-- Main app mount point — all HTML is generated by app.js -->
  <div id="app"></div>

  <!-- Toast container (outside app so it's always on top) -->
  <div id="toast-root" aria-live="polite"></div>

  <!-- Full-screen loading overlay -->
  <div id="loading-root" class="loading-root hidden" role="status">
    <div class="loading-inner">
      <div class="spinner"></div>
      <p id="loading-text">Working…</p>
    </div>
  </div>

  <!-- Bottom-sheet panel overlay -->
  <div id="panel-backdrop" class="panel-backdrop hidden"></div>
  <div id="panel-root" class="panel-root hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
