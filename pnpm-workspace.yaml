packages:
  - "apps/*"
  - "apps/oauth/ui"
  - "packages/*"
allowBuilds:
  # Transitive install scripts. pnpm 10+ blocks these until approved.
  # Placeholders ("set this to true or false") keep every install asking.
  esbuild: true
  core-js: true
  core-js-pure: true
  # openclaw is a dev dependency of packages/openclaw-poweur, used for its
  # types; neither it nor its dependencies need their install scripts here.
  "@google/genai": false
  koffi: false
  openclaw: false
  protobufjs: false
